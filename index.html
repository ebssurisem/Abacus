<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>컴퓨터용 대주판 - 반응형</title>
    <style>
        :root {
            /* [복구] 기존 수치 그대로 유지 */
            --bead-width: 120px;
            --bead-height: 60px;
            --beam-height: 20px;
            --rod-width: 16px;
            --frame-color: #2c1a15;
            --beam-bg: #ffffff;
            --abacus-bg: #2c1a15;
            --bead-main: #8d4a36; 
            --bead-light: #b36b53;
            --bead-dark: #5e2c1e;
            --upper-space: 90px; 
            --upper-gap: 30px; 
            --lower-gap: 31px; /* 가름대에 딱 붙는 기존 값 유지 */
        }

        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; background-color: #dcdcdc; font-family: sans-serif;
            -webkit-user-select: none; user-select: none;
            touch-action: none; 
        }

        .controls { margin-bottom: 20px; z-index: 100; }
        .reset-btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold; color: white;
            background-color: #444; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 #222; transition: all 0.1s;
            touch-action: manipulation;
        }
        .reset-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #222; }

        /* [반응형 핵심] 주판의 원래 크기는 유지하되, 화면이 작아지면 전체 배율을 줄임 */
        .abacus-scale-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .abacus {
            display: inline-flex; 
            background-color: var(--abacus-bg); 
            padding: 0 20px; border: 15px solid #110908; border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            /* 배율 조정의 기준점 */
            transform-origin: center center;
        }

        .column {
            position: relative; width: var(--bead-width); 
            height: 383px; 
            display: flex; flex-direction: column; align-items: center; margin: 0 2px;
        }

        .rod {
            position: absolute; width: var(--rod-width); height: 100%;
            background: linear-gradient(90deg, #d7ccc8, #bcaaa4, #d7ccc8); z-index: 1;
        }

        .beam {
            position: absolute; top: var(--upper-space);
            width: calc(100% + 10px); height: var(--beam-height);
            background-color: var(--beam-bg); z-index: 5;
            border-top: 2px solid #eee; border-bottom: 2px solid #888;
        }

        .dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; background-color: #000; border-radius: 50%;
            display: none; z-index: 6;
        }
        .has-dot .dot { display: block; }

        .bead {
            width: 100%; height: var(--bead-height); cursor: pointer; z-index: 10;
            position: absolute; transition: transform 0.1s ease-out;
            clip-path: polygon(43% 0%, 57% 0%, 100% 50%, 57% 100%, 43% 100%, 0% 50%);
            background: radial-gradient(circle at 50% 40%, var(--bead-light), var(--bead-main) 70%, var(--bead-dark));
            touch-action: none;
        }

        .bead.active {
            background: radial-gradient(circle at 50% 40%, #ff8a80, #e74c3c 70%, #b71c1c);
        }

        .upper-bead { top: 0; }
        .upper-bead.active { transform: translateY(var(--upper-gap)); } 

        .lower-area { 
            position: absolute; 
            top: calc(var(--upper-space) + var(--beam-height)); 
            bottom: 0; width: 100%; 
        }

        .low-4 { bottom: 180px; } 
        .low-3 { bottom: 120px; }
        .low-2 { bottom: 60px; }
        .low-1 { bottom: 0; }

        .lower-bead.active { transform: translateY(calc(var(--lower-gap) * -1)); }

        /* [추가] 화면 크기에 따른 스케일 자동 조절 스크립트 대응을 위한 설정 */
    </style>
</head>
<body>

<div class="controls">
    <button class="reset-btn" onclick="resetAbacus()">주판털기 (Reset)</button>
</div>

<div class="abacus-scale-container" id="container">
    <div class="abacus" id="abacus"></div>
</div>

<script>
    let audioCtx = null;

    // 사운드 로직 유지
    function playPlasticClick() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const duration = 0.05;
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        noise.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
        noise.start(); noise.stop(audioCtx.currentTime + duration);
    }

    const abacus = document.getElementById('abacus');
    const container = document.getElementById('container');
    const totalCols = 13;
    const dotPositions = [];
    for (let i = totalCols - 3; i >= 0; i -= 3) { dotPositions.push(i); }

    // 주판 생성 로직 유지
    for (let i = 0; i < totalCols; i++) {
        const col = document.createElement('div');
        col.className = 'column' + (dotPositions.includes(i) ? ' has-dot' : '');
        col.innerHTML = `
            <div class="rod"></div>
            <div class="beam"><div class="dot"></div></div>
            <div class="bead upper-bead"></div>
            <div class="lower-area">
                <div class="bead lower-bead low-1" data-idx="1"></div>
                <div class="bead lower-bead low-2" data-idx="2"></div>
                <div class="bead lower-bead low-3" data-idx="3"></div>
                <div class="bead lower-bead low-4" data-idx="4"></div>
            </div>
        `;
        abacus.appendChild(col);
    }

    // 반응형 스케일 계산 함수: 수치는 유지하고 배율만 조절
    function resizeAbacus() {
        const screenWidth = window.innerWidth * 0.95;
        const abacusWidth = abacus.offsetWidth;
        
        if (abacusWidth > screenWidth) {
            const scale = screenWidth / abacusWidth;
            abacus.style.transform = `scale(${scale})`;
        } else {
            abacus.style.transform = `scale(1)`;
        }
    }

    window.addEventListener('resize', resizeAbacus);
    window.addEventListener('load', resizeAbacus);

    document.querySelectorAll('.bead').forEach(bead => {
        bead.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            playPlasticClick();
            if (this.classList.contains('upper-bead')) {
                this.classList.toggle('active');
            } else {
                handleLower(this);
            }
        });
    });

    function handleLower(bead) {
        const area = bead.parentElement;
        const beads = area.querySelectorAll('.lower-bead');
        const idx = parseInt(bead.dataset.idx);
        const isActive = bead.classList.contains('active');
        beads.forEach(b => {
            const bIdx = parseInt(b.dataset.idx);
            if (!isActive && bIdx >= idx) b.classList.add('active');
            else if (isActive && bIdx <= idx) b.classList.remove('active');
        });
    }

    function resetAbacus() {
        if (audioCtx) playPlasticClick();
        document.querySelectorAll('.bead').forEach(bead => bead.classList.remove('active'));
    }

    const unlockAudio = () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        window.removeEventListener('pointerdown', unlockAudio);
    };
    window.addEventListener('pointerdown', unlockAudio);
    
    // 초기 로드 시 한 번 실행
    setTimeout(resizeAbacus, 100);
</script>

</body>
</html>
