<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>반응형 교육용 대주판</title>
    <style>
        :root {
            /* 반응형 크기 설계: 화면 높이에 맞춰 주판 크기가 자동 조절됨 */
            --bead-width: min(80px, 7vw);
            --bead-height: calc(var(--bead-width) * 0.5);
            --beam-height: calc(var(--bead-width) * 0.15);
            --rod-width: calc(var(--bead-width) * 0.12);
            
            --frame-color: #2c1a15;
            --beam-bg: #ffffff;
            --abacus-bg: #2c1a15;
            --bead-main: #8d4a36; 
            --bead-light: #b36b53;
            --bead-dark: #5e2c1e;
            
            --upper-space: calc(var(--bead-height) * 1.5); 
            --upper-gap: calc(var(--bead-height) * 0.5); 
            --lower-gap: calc(var(--upper-gap) + 1px); 
        }

        body {
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; background-color: #dcdcdc; font-family: sans-serif;
            -webkit-user-select: none; user-select: none;
            touch-action: none; 
            overflow: hidden; /* 바디 스크롤 방지 */
        }

        .controls { 
            margin-bottom: min(20px, 2vh); 
            z-index: 100; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
        }
        
        .reset-btn {
            padding: 12px 30px; font-size: 18px; font-weight: bold; color: white;
            background-color: #444; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 0 #222; transition: all 0.1s;
            touch-action: manipulation;
        }
        .reset-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #222; }

        .abacus-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: auto; /* 좁은 화면에서 가로 스크롤 */
            padding: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .abacus {
            display: inline-flex; 
            background-color: var(--abacus-bg); 
            padding: 0 min(20px, 2vw); 
            border: min(15px, 1.5vw) solid #110908; 
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            flex-shrink: 0; /* 크기 유지 */
        }

        .column {
            position: relative; 
            width: var(--bead-width); 
            /* 전체 높이를 주판알 크기에 비례하게 설정 */
            height: calc(var(--bead-height) * 6.5); 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0 1px;
        }

        .rod {
            position: absolute; width: var(--rod-width); height: 100%;
            background: linear-gradient(90deg, #d7ccc8, #bcaaa4, #d7ccc8); z-index: 1;
        }

        .beam {
            position: absolute; top: var(--upper-space);
            width: calc(100% + 4px); height: var(--beam-height);
            background-color: var(--beam-bg); z-index: 5;
            border-top: 1px solid #eee; border-bottom: 1px solid #888;
        }

        .dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: calc(var(--rod-width) * 0.8); 
            height: calc(var(--rod-width) * 0.8); 
            background-color: #000; border-radius: 50%;
            display: none; z-index: 6;
        }
        .has-dot .dot { display: block; }

        .bead {
            width: 100%; height: var(--bead-height); cursor: pointer; z-index: 10;
            position: absolute; transition: transform 0.1s ease-out;
            clip-path: polygon(43% 0%, 57% 0%, 100% 50%, 57% 100%, 43% 100%, 0% 50%);
            background: radial-gradient(circle at 50% 40%, var(--bead-light), var(--bead-main) 70%, var(--bead-dark));
            touch-action: none;
        }

        .bead.active {
            background: radial-gradient(circle at 50% 40%, #ff8a80, #e74c3c 70%, #b71c1c);
        }

        .upper-bead { top: 0; }
        .upper-bead.active { transform: translateY(var(--upper-gap)); } 

        .lower-area { 
            position: absolute; 
            top: calc(var(--upper-space) + var(--beam-height)); 
            bottom: 0; width: 100%; 
        }

        /* 아래알 위치를 높이에 따라 유동적으로 배치 */
        .low-4 { bottom: calc(var(--bead-height) * 3); } 
        .low-3 { bottom: calc(var(--bead-height) * 2); }
        .low-2 { bottom: calc(var(--bead-height) * 1); }
        .low-1 { bottom: 0; }

        .lower-bead.active { transform: translateY(calc(var(--lower-gap) * -1)); }

        /* 가로 모드에서 높이가 너무 낮을 때 대응 */
        @media (max-height: 400px) {
            :root {
                --bead-width: min(60px, 15vh);
            }
            .controls { margin-bottom: 5px; }
            .reset-btn { padding: 8px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="controls">
    <button class="reset-btn" onclick="resetAbacus()">주판털기 (Reset)</button>
</div>

<div class="abacus-wrapper">
    <div class="abacus" id="abacus"></div>
</div>

<script>
    let audioCtx = null;

    function playPlasticClick() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const duration = 0.05;
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1000, audioCtx.currentTime);

        const gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        noise.start();
        noise.stop(audioCtx.currentTime + duration);
    }

    const abacus = document.getElementById('abacus');
    const totalCols = 13;
    const dotPositions = [];
    for (let i = totalCols - 3; i >= 0; i -= 3) { dotPositions.push(i); }

    for (let i = 0; i < totalCols; i++) {
        const col = document.createElement('div');
        col.className = 'column' + (dotPositions.includes(i) ? ' has-dot' : '');
        col.innerHTML = `
            <div class="rod"></div>
            <div class="beam"><div class="dot"></div></div>
            <div class="bead upper-bead"></div>
            <div class="lower-area">
                <div class="bead lower-bead low-1" data-idx="1"></div>
                <div class="bead lower-bead low-2" data-idx="2"></div>
                <div class="bead lower-bead low-3" data-idx="3"></div>
                <div class="bead lower-bead low-4" data-idx="4"></div>
            </div>
        `;
        abacus.appendChild(col);
    }

    document.querySelectorAll('.bead').forEach(bead => {
        bead.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            playPlasticClick();
            if (this.classList.contains('upper-bead')) {
                this.classList.toggle('active');
            } else {
                handleLower(this);
            }
        });
    });

    function handleLower(bead) {
        const area = bead.parentElement;
        const beads = area.querySelectorAll('.lower-bead');
        const idx = parseInt(bead.dataset.idx);
        const isActive = bead.classList.contains('active');
        
        beads.forEach(b => {
            const bIdx = parseInt(b.dataset.idx);
            if (!isActive && bIdx >= idx) b.classList.add('active');
            else if (isActive && bIdx <= idx) b.classList.remove('active');
        });
    }

    function resetAbacus() {
        if (audioCtx) playPlasticClick();
        document.querySelectorAll('.bead').forEach(bead => {
            bead.classList.remove('active');
        });
    }

    const unlockAudio = () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        window.removeEventListener('pointerdown', unlockAudio);
    };
    window.addEventListener('pointerdown', unlockAudio);
</script>

</body>
</html>
